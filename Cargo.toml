[workspace]
resolver = "2"
members = [
    "rustray",
    "edgeray-app",
    "edgeray-app/src-tauri",
]


[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["J-rad"]
license = "MIT"
repository = "https://github.com/j.rad/edgeray"

[workspace.dependencies]
# Unified dependency management to prevent version mismatches
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
bytes = "1.5"
log = "0.4"
thiserror = "1.0"
anyhow = "1.0"
uniffi = "0.25"
rustray = { path = "./rustray" }


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
