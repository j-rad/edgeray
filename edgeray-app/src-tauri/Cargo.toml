[package]
name = "edgeray-tauri"
version = "0.1.0"
description = "EdgeRay Client"
authors = ["EdgeRay Team"]
edition = "2021"

[lib]
name = "edgeray_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
log = "0.4"
surrealdb = { version = "2", default-features = false, features = ["kv-surrealkv"] }
once_cell = "1"
dirs = "5"
async-trait.workspace = true
libc = "0.2.178"
url = "2.5.7"
base64 = "0.22.1"
anyhow.workspace = true
uuid = { version = "1.19.0", features = ["v4", "serde"] }
window-vibrancy = "0.5"
rustray = { path = "../../rustray" }
rutls = { git = "https://github.com/FaezBarghasa/rutls-workspace", features = ["tokio"] }


