[package]
name = "edgeray-dioxus"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.2", features = ["web", "router"] }
dioxus-web = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.99"
web-sys = { version = "0.3.76", features = ["Window", "console"] }
js-sys = "0.3.76"
dioxus-free-icons = { version = "0.8.6", features = ["font-awesome-solid", "font-awesome-regular"] }
wasm-bindgen-futures = "0.4.49"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[lints]
workspace = true
