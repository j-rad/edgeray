name: Release Distribution

on:
    release:
        types: [created]

env:
    CARGO_TERM_COLOR: always

jobs:
    build-desktop:
        name: Build Desktop (${{ matrix.platform }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux-x86_64
                      target: x86_64-unknown-linux-gnu
                      ext: AppImage
                    - os: windows-latest
                      platform: windows-x86_64
                      target: x86_64-pc-windows-msvc
                      ext: msi
                    - os: macos-latest
                      platform: macos-x86_64
                      target: x86_64-apple-darwin
                      ext: dmg
                    - os: macos-latest
                      platform: macos-aarch64
                      target: aarch64-apple-darwin
                      ext: dmg

        steps:
            - uses: actions/checkout@v4

            - name: Install System Dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y \
                protobuf-compiler \
                libprotobuf-dev \
                libelf-dev \
                clang \
                llvm \
                pkg-config \
                libssl-dev \
                nftables

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                components: rustfmt, clippy
                targets: wasm32-unknown-unknown

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Build Core (All Features)
              # Verifies compilation for the entire evasion matrix
              run: cargo build --verbose --features "ebpf quic masque cdn_loop stego shaping"

            - name: Run Core Logic Tests
              run: cargo test --verbose --lib --bins

            - name: Install Dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install Dependencies (macOS)
              if: runner.os == 'macOS'
              run: brew install cross

            - name: Install Build Tools (Windows)
              if: runner.os == 'Windows'
              run: |
                  # Add Windows specific setup if needed (e.g. WiX for MSI)
                  echo "Windows Setup"

            - name: Build and Bundle (Tauri)
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  # Windows Signing
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
                  # MacOS Signing
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: "EdgeRay ${{ github.ref_name }}"
                  releaseBody: "Automated release for ${{ github.ref_name }}"
                  releaseDraft: true
                  prerelease: false
                  args: --target ${{ matrix.target }}

    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Java
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

            - name: Install NDK
              run: echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

            - name: Build Android Bundle and APK
              working-directory: ./edgeray-app/gen/android
              run: ./gradlew assembleRelease bundleRelease
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

            - name: Sign APK
              if: env.ANDROID_KEYSTORE_BASE64 != ''
              run: |
                  # Signing logic is usually handled by Gradle if secrets are passed
                  # If manual signing is needed, use apksigner here
                  echo "Signing handled by Gradle"

            - name: Upload APKs to Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      edgeray-app/gen/android/app/build/outputs/apk/release/*.apk
                      edgeray-app/gen/android/app/build/outputs/bundle/release/*.aab

    build-ios:
        name: Build iOS
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-ios,x86_64-apple-ios

            - name: Build iOS IPA
              working-directory: ./edgeray-app/gen/apple
              run: |
                  # Placeholder for xcodebuild command
                  # xcodebuild -scheme edgeray_app -archivePath build/edgeray.xcarchive archive
                  # xcodebuild -exportArchive ...
                  echo "Building iOS IPA..."
              env:
                  IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
                  IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

            # Note: iOS usually requires manual upload to TestFlight or intricate signing.
            # We just output the IPA if possible.

    upload-geodata:
        name: Upload Geodata
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Generate/Fetch Geodata
              run: |
                  # Try to find generation script or download
                  if [ -f "scripts/generate_geodata.sh" ]; then
                     bash scripts/generate_geodata.sh
                  else
                     echo "Downloading canonical geodata..."
                     curl -L -o geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
                     curl -L -o geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
                     mv dlc.dat geosite.dat
                  fi

            - name: Upload Assets
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      geoip.dat
                      geosite.dat
